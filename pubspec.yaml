name: wasilaah_finishing
description: "Wasila Packaging - Barcode label printing app integrated with Odoo ERP"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  barcode_widget: ^2.0.4
  pdf: ^3.11.2
  printing: ^5.14.2
  barcode: ^2.2.8
  get_it: ^8.0.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  background_color: "#1B5E20" 
  remove_alpha_ios: true
  min_sdk_android: 21 